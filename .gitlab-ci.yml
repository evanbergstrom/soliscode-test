#
# The project's one pipeline: it publishes the Javadoc that scripts/publish-javadoc.sh built on a developer's
# machine and stored in the project's generic package registry, to GitLab Pages. It builds nothing and runs no
# gate; the gates run locally (docs/design/reference/documentation.md, section 3.3). Only a pipeline created
# through the API runs: a push, a merge request or a schedule starts none. A child that publishes has a copy,
# installed by soliscode:docs from the tag of its parent version.
spec:
  inputs:
    versions:
      description: The stored Javadoc versions to publish, oldest first, separated by spaces; the last is latest/.
      type: string
      default: ""
      regex: ^([0-9]+(\.[0-9]+)*( |$))*$
---
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "api"

pages:
  # The one version outside Maven (docs/design/reference/dependency-management.md). busybox has wget and unzip,
  # so nothing unpinned is installed.
  image: alpine:3.22.2
  # Two deployments never run at once, so an older list cannot replace a newer one.
  resource_group: pages
  # Run by the project runner on the publisher's machine, which publish-javadoc.sh starts for this one job, never by
  # GitLab's instance runners and their compute minutes.
  tags:
    - soliscode-pages
  pages: true
  # pages: true adds public/ to the artifacts itself; named here too, so the job does not rest on that. Only
  # developers may download the artifact, so it is no second way to the Javadoc where pipelines are public.
  artifacts:
    access: developer
    paths:
      - public
  variables:
    VERSIONS: $[[ inputs.versions ]]
  script:
    - test -n "$VERSIONS" || { echo "no versions given"; exit 1; }
    - mkdir -p public
    - |
      latest=""
      for version in $VERSIONS; do
        wget -q --header "JOB-TOKEN: $CI_JOB_TOKEN" -O javadoc.zip \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/javadoc/$version/javadoc.zip"
        mkdir -p "public/$version"
        unzip -q javadoc.zip -d "public/$version"
        rm javadoc.zip
        latest=$version
      done
      cp -R "public/$latest" public/latest
      echo "$latest" > public/latest/VERSION
      for version in $VERSIONS; do echo "$version"; done > public/versions.txt
      echo "$CI_PIPELINE_ID" > public/deployment.txt
      : > "public/deployment-$CI_PIPELINE_ID.txt"
      {
        echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
        echo "<title>$CI_PROJECT_TITLE API reference</title></head><body>"
        echo "<h1>$CI_PROJECT_TITLE API reference</h1><ul>"
        echo "<li><a href=\"latest/\">latest</a> ($latest)</li>"
        for version in $VERSIONS; do echo "<li><a href=\"$version/\">$version</a></li>"; done
        echo '</ul></body></html>'
      } > public/index.html
