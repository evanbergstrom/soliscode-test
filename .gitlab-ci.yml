# .gitlab-ci.yml

# Include shared CI/CD templates from soliscode-parent
include:
  - project: 'soliscode/soliscode-parent'
    file: '/.gitlab-ci.yml'

# Use parent defaults and workflow rules
default:
  extends: .soliscode_defaults

workflow:
  extends: .soliscode_workflow_rules

# Project-specific variables (parent provides common ones)
variables:
  SITE_DIR: "target/staging"
  MAVEN_CLI_OPTS: "-B -s /tmp/settings.xml -Ddependency-check.skip=true" #speed up build while working on CI/CD

# ---------- Build ----------
build:
  extends:
    - .build_template
    - .soliscode_workflow_rules
  script:
    # Override to skip tests and package instead of just compile
    - mvn -DskipTests $MAVEN_CLI_OPTS package
  artifacts:
    when: always
    paths:
      - target/*.jar
      - target/*.pom
    expire_in: 1 week

# ---------- Test ----------
test:
  extends:
    - .test_template
    - .soliscode_workflow_rules
  needs: ["build"]
  script:
    # Temporarily skip tests while working out CI/CD bugs
    - mvn $MAVEN_CLI_OPTS -DskipTests verify

# ---------- Snapshot Publishing ----------
publish:snapshot:
  extends: .snapshot_template
  needs: ["test"]

# ---------- Semantic Release ----------
semantic_release:
  extends: .semantic_release_template
  needs: ["test"]
  variables:
    SERVER_USERNAME: "$CENTRAL_USERNAME"
    SERVER_PASSWORD: "$CENTRAL_PASSWORD"
    GPG_PRIVATE_KEY: "$GPG_PRIVATE_KEY_ARMOR"
    GPG_PASSPHRASE: "$GPG_PASSPHRASE"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - CHANGELOG.md

# ---------- Release Publishing ----------
publish:release:
  extends: .release_deploy_template

# ---------- Site Generation ----------
site:build:
  extends: .site_template
  needs: ["publish:release"]
  variables:
    SITE_DIR: "target/staging"

site:deploy:gh-pages:
  extends: .soliscode_defaults
  stage: site
  needs: ["site:build"]
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+(?:[-+].*)?$/'
      when: on_success
    - when: never
  variables:
    SITE_DIR: "target/staging"
  before_script:
    - |
      echo "Deploying site to GitHub" 
      : "${GITHUB_PAT:?missing GITHUB_PAT}"
      : "${GITHUB_REPO:?missing GITHUB_REPO}"   # e.g. owner/repo
      : "${GITHUB_EMAIL:=soliscode-bot@users.noreply.github.com}"
      : "${GITHUB_NAME:=soliscode-bot}"
      apt-get update && apt-get install -y git rsync
      git config --global user.email "$GITHUB_EMAIL"
      git config --global user.name  "$GITHUB_NAME"
      mkdir gh-pages && cd gh-pages
      git init
      git remote add origin "https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPO}.git"
      git fetch origin gh-pages || true
      git checkout -B gh-pages
  script:
    - rsync -a --delete --exclude ".git" "${CI_PROJECT_DIR}/${SITE_DIR:-target/site}/" .
    - touch .nojekyll
    - git add -A
    - |
      git commit -m "Publish Maven site: ${CI_COMMIT_TAG}" || echo "No changes"
    - git push -f origin gh-pages